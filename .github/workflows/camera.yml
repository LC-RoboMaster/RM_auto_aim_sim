name: Camera and simulation checks
on:
  push:
    branches: [feat/hdr-shader-telemetry]
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libglfw3-dev libyaml-cpp-dev libgl1-mesa-dev libegl1-mesa-dev
          python3 -m pip install mujoco==3.3.7
      - name: Build
        run: cmake -S src/rm_auto_aim_sim -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_ROS2=OFF -DCONDA_PYTHON=$(which python3)
      - name: Compile and run checks
        run: |
          set -o pipefail
          {
            cmake --build build --parallel 2
            ctest --test-dir build --output-on-failure
            MUJOCO_GL=egl python3 src/rm_auto_aim_sim/tests/run_render_test.py --library build/libaim_render_probe.so --output build/camera_probe.ppm
          } 2>&1 | tee build/check.log
      - name: Expose failed check details
        if: failure()
        run: |
          if [ -f build/check.log ]; then
            echo '### Camera check output' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 build/check.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E 'error:|CMake Error|FAIL|failed|Traceback' build/check.log | tail -n 10 | while IFS= read -r line; do echo "::error::$line"; done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-probe-images
          path: build/camera_probe.ppm*
          if-no-files-found: ignore
  ros_humble:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS bridge and camera dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends g++ cmake ninja-build python3-pip libglfw3-dev libyaml-cpp-dev libgl1-mesa-dev \
            ros-humble-ament-cmake ros-humble-rclcpp ros-humble-rcl-interfaces \
            ros-humble-sensor-msgs ros-humble-geometry-msgs ros-humble-rosgraph-msgs \
            ros-humble-std-msgs ros-humble-tf2-msgs
          /usr/bin/python3 -m pip install mujoco==3.3.7
      - name: Build ROS 2 Humble bridge
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cmake -S src/rm_auto_aim_sim -B build_ros -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_ROS2=ON -DBUILD_TESTING=OFF -DCONDA_PYTHON=/usr/bin/python3
          cmake --build build_ros --parallel 2
          build_ros/rm_auto_aim_sim --help
