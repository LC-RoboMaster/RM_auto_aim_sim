# All units: metres, seconds, radians (except camera_fovy_deg).
rm_auto_aim_sim:
  ros__parameters:
    scene_path: "../scenes/lab.xml"
    initial_mode: "manual"
    camera_enabled: true
    camera_width: 1280
    camera_height: 1024
    camera_fps: 120.0
    camera_fovy_deg: 60.0
    camera_msaa: 0
    state_hz: 150.0
    physics_timestep: 0.0005
    manual_translation_speed: 2.0
    manual_angular_speed: 1.5
    mouse_sensitivity: 0.003
    yaw_min: -3.141592653589793
    yaw_max: 3.141592653589793
    pitch_min: -0.523598775598299
    pitch_max: 0.785398163397448
    servo_max_speed: 8.0
    base_x_min: -12.0
    base_x_max: 12.0
    base_y_min: -9.0
    base_y_max: 9.0
    base_z_min: 0.2
    base_z_max: 3.0
    fire_rate_hz: 15.0
    projectile_speed: 25.0
    projectile_diameter: 0.017
    projectile_mass: 0.0032
    projectile_pool_size: 128
    projectile_lifetime: 8.0
    projectile_hit_lifetime: 2.0
    fire_command_timeout: 0.0
    angle_command_timeout: 0.0
    model_base_body: "base_link"
    model_yaw_body: "yaw_link"
    model_pitch_body: "pitch_link"
    model_camera_body: "camera_link"
    model_yaw_joint: "yaw_joint"
    model_pitch_joint: "pitch_joint"
    model_camera_name: "gimbal_camera"
    model_muzzle_site: "muzzle"
    frame_world: "world"
    frame_base: "odom"
    frame_yaw: "yaw_link"
    frame_pitch: "pitch_link"
    frame_camera: "camera_link"
    frame_camera_optical: "camera_optical_frame"
    frame_muzzle: "muzzle_link"
    topic_image: "/image_raw"
    topic_camera_info: "/camera_info"
    topic_pitch_state: "/gimbal/pitch"
    topic_yaw_state: "/gimbal/yaw"
    topic_pitch_command: "/gimbal/target_pitch"
    topic_yaw_command: "/gimbal/target_yaw"
    topic_fire_command: "/gimbal/fire"
    topic_joint_states: "/joint_states"
    topic_clock: "/clock"
    topic_tf: "/tf"
    topic_tf_static: "/tf_static"
    topic_shot_count: "/sim/shot_count"
    topic_hit_event: "/sim/projectile_hit"
    topic_camera_fps: "/sim/camera_fps"

    # Four-board target: metres, plate centre heights; rotation in signed rad/s.
    target_enabled: true
    target_x: 5.0
    target_y: 0.0
    target_z: 0.0
    target_r1: 0.6
    target_r2: 0.6
    target_h1: 0.8
    target_h2: 0.8
    target_tilt_deg: 15.0
    target_angular_speed: 0.0
    target_initial_angle: 0.0
    target_color: "blue"
    lighting_brightness: 0.135
    # Rectified camera K in pixels. Set true to replace FOV with these values.
    camera_use_intrinsics: true
    camera_fx: 1576.115395
    camera_fy: 1566.175713
    camera_cx: 656.289108
    camera_cy: 510.515086
    # import_rmuc_field.py produces an RMUC config with an absolute field_xml.
    field_xml: ""

    # Binary-image armor testing: black background and brighter grayscale LED colours.
    dark_sky: true
    environment_albedo: 1.0
    target_light_whiteness: 0.45
